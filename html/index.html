<!DOCTYPE html>
<html lang="pt-PT">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Património · Gestão financeira</title>
<link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
<link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css" rel="stylesheet">
<link href="../css/style.css" rel="stylesheet">
</head>
<body>

<!-- Cabeçalho Liquid Glass: logótipo | opções principais | ações -->
<header class="topnav glass">
  <a class="logo" href="#dashboard" aria-label="Início"><i class="bi bi-pie-chart-fill"></i><span>Património<small>Gestão financeira</small></span></a>
  <nav class="main-links" id="mainLinks" aria-label="Navegação principal"></nav>
  <div class="actions">
    <input class="search form-control" id="q" placeholder="Pesquisar…" aria-label="Pesquisar">
    <button class="btn-pill btn-green" id="addBtn"><i class="bi bi-plus-lg"></i> <span class="d-none d-sm-inline">Nova operação</span></button>
    <button class="btn-pill btn-soft" id="moreBtn" aria-haspopup="true" aria-expanded="false" aria-controls="morePop"><i class="bi bi-grid-3x3-gap-fill"></i> <span class="d-none d-sm-inline">Mais</span></button>
  </div>
</header>
<!-- Mini janela com os restantes ecrãs (canto superior direito) -->
<div class="more-pop glass" id="morePop" hidden></div>

<main>
  <section class="view" id="dashboard"></section>
  <section class="view" id="bancos"></section>
  <section class="view" id="depositos"></section>
  <section class="view" id="comparador"></section>
  <section class="view" id="cripto"></section>
  <section class="view" id="bolsa"></section>
  <section class="view" id="historico"></section>
  <section class="view" id="alertas"></section>
</main>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
<script src="../js/app.js"></script>
</body>
</html>
