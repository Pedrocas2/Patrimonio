<!DOCTYPE html>
<html lang="pt-PT">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Património · Gestão financeira</title>
<link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
<link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css" rel="stylesheet">
<link href="../css/style.css" rel="stylesheet">
</head>
<body>

<!-- Sidebar -->
<nav class="sidebar glass" id="nav" aria-label="Navegação principal"></nav>

<main>
  <!-- Navbar transparente -->
  <header class="topbar d-flex align-items-center gap-3">
    <div class="me-auto"><div class="text-muted small">Olá, bem-vindo</div><h1 class="h4 m-0 fw-bold" id="title">Dashboard</h1></div>
    <input class="search form-control d-none d-md-block w-auto" id="q" placeholder="Pesquisar bancos, ativos…" aria-label="Pesquisar">
    <button class="btn-pill btn-green" id="addBtn"><i class="bi bi-plus-lg"></i> <span class="d-none d-sm-inline">Nova operação</span></button>
  </header>

  <section class="view" id="dashboard"></section>
  <section class="view" id="bancos"></section>
  <section class="view" id="depositos"></section>
  <section class="view" id="comparador"></section>
  <section class="view" id="cripto"></section>
  <section class="view" id="bolsa"></section>
  <section class="view" id="historico"></section>
  <section class="view" id="alertas"></section>
</main>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
<script src="../js/app.js"></script>
</body>
</html>
